0" font-size="13" font-weight="600" letter-spacing=".5">CARD VAULT</text></g><g class="badge-float-2" transform="translate(60, 270)"><rect width="170" height="38" fill="#1e293b" stroke="#fbbf24" stroke-opacity=".4" stroke-width="1.5" rx="19"/><circle cx="20" cy="19" r="6" fill="#fbbf24"/><text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing=".5">UNIFIED API</text></g><g id="foreground-content"><g transform="translate(600, 75)"><rect width="270" height="28" x="-135" y="-14" fill="#1e293b" stroke="#334155" stroke-width="1" rx="14"/><text y="4" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ CURATED REPOSITORY ⚡</text></g><text x="600" y="145" fill="#fff" font-size="40" font-weight="800" letter-spacing="-.5" text-anchor="middle">Awesome Payment Gateway Orchestration</text><text x="600" y="185" fill="url(#accentGrad)" font-size="19" font-weight="600" letter-spacing=".2" text-anchor="middle">Intelligent Routing • Cascading Retries • Multi-PSP Aggregation • Open-Source &amp; Enterprise</text><text x="600" y="222" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">A directory of leading platforms and frameworks to optimize payment conversion, reduce cost, and eliminate downtime.</text><g><g transform="translate(600, 275) translate(-240, 0)"><rect width="140" height="30" x="-70" y="-15" fill="#1e293b" stroke="#334155" rx="15"/><text y="5" fill="#f1f5f9" font-size="12" font-weight="500" text-anchor="middle">🏢 Stripe / Adyen</text></g><g transform="translate(600, 275) translate(-80, 0)"><rect width="150" height="30" x="-75" y="-15" fill="#1e293b" stroke="#334155" rx="15"/><text y="5" fill="#f1f5f9" font-size="12" font-weight="500" text-anchor="middle">🦀 Hyperswitch / Rust</text></g><g transform="translate(600, 275) translate(85, 0)"><rect width="150" height="30" x="-75" y="-15" fill="#1e293b" stroke="#334155" rx="15"/><text y="5" fill="#f1f5f9" font-size="12" font-weight="500" text-anch