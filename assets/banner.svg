<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for soft glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
      .conn-line { stroke: #334155; stroke-dasharray: 6,6; stroke-width: 2; fill: none; }
      .active-pulse { stroke-dasharray: 12, 180; stroke-width: 3.5; stroke-linecap: round; animation: flow 4s linear infinite; }
      .pulse-1 { stroke: #38bdf8; animation-delay: 0s; }
      .pulse-2 { stroke: #818cf8; animation-delay: 1.3s; }
      .pulse-3 { stroke: #34d399; animation-delay: 2.6s; }

      @keyframes flow {
        from { stroke-dashoffset: 192; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }

      .ambient-orb {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite alternate;
      }

      .ambient-orb-2 {
        transform-origin: center;
        animation: pulseGlow 8s ease-in-out infinite alternate-reverse;
      }

      /* Float animations for badges */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      .badge-float-1 { animation: floatSlow 5s ease-in-out infinite; }
      .badge-float-2 { animation: floatSlow 6s ease-in-out infinite 1s; }
      .badge-float-3 { animation: floatSlow 5.5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Ambient background glow spheres (strictly behind) -->
  <circle class="ambient-orb" cx="180" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle class="ambient-orb-2" cx="1020" cy="240" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle class="ambient-orb" cx="600" cy="320" r="180" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle grid pattern -->
  <g class="bg-grid">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Animated Dynamic Routing Circuit in Background / Side Accents -->
  <g id="circuit-lines">
    <!-- Path from Left Source to Central Router -->
    <path class="conn-line" d="M 80,180 Q 220,180 340,240" />
    <path class="conn-line active-pulse pulse-1" d="M 80,180 Q 220,180 340,240" />

    <!-- Path from Router to Provider Alpha (Top Right) -->
    <path class="conn-line" d="M 860,240 C 940,240 980,120 1100,120" />
    <path class="conn-line active-pulse pulse-2" d="M 860,240 C 940,240 980,120 1100,120" />

    <!-- Path from Router to Provider Beta (Bottom Right) -->
    <path class="conn-line" d="M 860,240 C 940,240 980,290 1100,290" />
    <path class="conn-line active-pulse pulse-3" d="M 860,240 C 940,240 980,290 1100,290" />
  </g>

  <!-- Dynamic Badges / Floating Mini-Pills (Framed on flanks, keeping center unobstructed) -->
  <g class="badge-float-1" transform="translate(60, 60)">
    <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">SMART ROUTING</text>
  </g>

  <g class="badge-float-2" transform="translate(970, 50)">
    <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#34d399" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">AUTO RETRIES</text>
  </g>

  <g class="badge-float-3" transform="translate(990, 270)">
    <rect width="150" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#c084fc" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">CARD VAULT</text>
  </g>

  <g class="badge-float-2" transform="translate(60, 270)">
    <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#fbbf24" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">UNIFIED API</text>
  </g>

  <!-- FOREGROUND: Core Brand & Headers (Always crisp, prominent, high contrast) -->
  <g id="foreground-content">
    <!-- Pre-Header Category Tag -->
    <g transform="translate(600, 75)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED REPOSITORY ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome Payment Gateway Orchestration
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" text-anchor="middle" fill="url(#accentGrad)" font-size="19" font-weight="600" letter-spacing="0.2">
      Intelligent Routing • Cascading Retries • Multi-PSP Aggregation • Open-Source &amp; Enterprise
    </text>

    <!-- Description Paragraph -->
    <text x="600" y="222" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400">
      A directory of leading platforms and frameworks to optimize payment conversion, reduce cost, and eliminate downtime.
    </text>

    <!-- Bottom Feature Tags Container -->
    <g transform="translate(600, 275)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" />
        <text text-anchor="middle" y="5" fill="#f1f5f9" font-size="12" font-weight="500">🏢 Stripe / Adyen</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(-80, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" />
        <text text-anchor="middle" y="5" fill="#f1f5f9" font-size="12" font-weight="500">🦀 Hyperswitch / Rust</text>
      </g>
      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(85, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" />
        <text text-anchor="middle" y="5" fill="#f1f5f9" font-size="12" font-weight="500">⚡ BTCPay / Omnipay</text>
      </g>
      <!-- Pill 4: Zero Vendor Lock-in -->
      <g transform="translate(245, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" />
        <text text-anchor="middle" y="5" fill="#f1f5f9" font-size="12" font-weight="500">🔒 Token Vaults</text>
      </g>
    </g>
  </g>
</svg>