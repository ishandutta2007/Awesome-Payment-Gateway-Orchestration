<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:12px;overflow:hidden"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}.bg-grid{stroke:#1e293b;stroke-width:1;stroke-opacity:.35}.conn-line{stroke:#334155;stroke-dasharray:6,6;stroke-width:2;fill:none}.active-pulse{stroke-dasharray:12,180;stroke-width:3.5;stroke-linecap:round;animation:flow 4s linear infinite}.pulse-1{stroke:#38bdf8;animation-delay:0s}.pulse-2{stroke:#818cf8;animation-delay:1.3s}.pulse-3{stroke:#34d399;animation-delay:2.6s}.ambient-orb,.ambient-orb-2{transform-origin:center;animation:pulseGlow 6s ease-in-out infinite alternate}.ambient-orb-2{animation:pulseGlow 8s ease-in-out infinite alternate-reverse}.badge-float-1{animation:floatSlow 5s ease-in-out infinite}.badge-float-2{animation:floatSlow 6s ease-in-out infinite 1s}.badge-float-3{animation:floatSlow 5.5s ease-in-out infinite 2s}</style></defs><rect width="1200" height=